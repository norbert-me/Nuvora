server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # ─── Kompression: JS/CSS/JSON/SVG gehen sonst unkomprimiert raus ───
    # Das Frontend-Bundle (KaTeX, dnd-kit, lzma, alle Modulseiten) ist groß;
    # gzip spart grob 70 % Übertragung. gzip_vary setzt den Vary-Header, damit
    # Caches komprimiert und unkomprimiert getrennt halten.
    # gzip_static: das Bundle liegt beim Bauen schon als .gz daneben (siehe
    # Dockerfile). nginx schickt dann die fertige Datei, statt bei JEDEM Aufruf
    # dasselbe Megabyte neu zu komprimieren — auf einem kleinen Schulserver ist
    # das der Unterschied zwischen einer CPU-Spitze je Besucher und keiner.
    # gzip on bleibt als Rueckfall fuer alles ohne .gz (API-Antworten vom
    # Backend, dynamische Pfade).
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml application/xml font/woff2
               application/wasm;

    # Sicherheits-Header sitzen jetzt zentral am Nuvora-Proxy (nginx.conf im
    # Wurzelverzeichnis), damit /api und die eingebettete Lernpfad-App sie
    # ebenfalls bekommen. Hier gesetzt wuerden sie doppelt ankommen.

    # ─── Gehashte Build-Assets lange cachen ───
    # Vite legt Assets unter /assets/name.[hash].ext ab; der Hash ändert sich bei
    # jedem Inhalt, also sind sie unveränderlich und dürfen 1 Jahr im Browser-Cache
    # bleiben. Wiederbesuche laden sie gar nicht neu. index.html bleibt ungecacht
    # (siehe unten), damit ein neuer Build sofort auf die neuen Hashes zeigt.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Mitgelieferte Fremdbibliotheken (opencv.js fuer die Kartenerkennung im
    # Browser, rund 10 MB). Sie tragen keinen Hash im Namen, sind aber auf eine
    # Fassung festgenagelt und werden nur beim Austausch der Datei ein anderer
    # Inhalt — also lange cachen. Ohne diesen Block liefe die Datei ueber den
    # SPA-Rueckfall und wuerde nach der Heuristik des Browsers behandelt: im
    # Zweifel bei jedem Betreten der Scan-Seite erneut geholt.
    location /vendor/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # opencv.wasm MUSS als application/wasm herausgehen: nur dann uebersetzt der
    # Browser sie im Datenstrom (WebAssembly.instantiateStreaming); bei jedem
    # anderen Typ faellt Emscripten still auf den langsameren Weg zurueck — erst
    # 8 MB in einen ArrayBuffer, dann uebersetzen. Der Typ steht hier statt im
    # Vertrauen auf mime.types, weil der sonst an der Fassung des Basis-Images
    # haengt. Eigener Block und kein `types` im /vendor/-Block: ein `types` in
    # einer location ERSETZT die ganze Zuordnung, und opencv.js ginge dann als
    # application/octet-stream heraus — mit `X-Content-Type-Options: nosniff`
    # (Proxy) lehnt der Browser das Skript ab. Ein Regex-Block sticht den
    # Praefix-Block, deshalb wird das Cachen hier wiederholt.
    location ~ \.wasm$ {
        expires 1y;
        add_header Cache-Control "public";
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    # index.html nie cachen — sonst zeigt der Browser nach einem Deploy weiter auf
    # alte, gelöschte Asset-Hashes (weiße Seite).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Die Vorlade-Liste des Service-Workers zeigt auf die gehashten Dateien des
    # AKTUELLEN Builds. Aus dem Cache waere sie nach einem Deploy eine Liste
    # geloeschter Namen — der Worker lud dann beim Installieren lauter 404.
    location = /precache.json {
        add_header Cache-Control "no-cache";
    }

    # Die Lernpfad-Statik traegt keinen Hash im Dateinamen — sie MUSS bei jedem
    # Deploy neu geholt werden, sonst laeuft die alte app.js weiter und die
    # Aenderung sieht "gleich aus".
    location /lp/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA-Fallback: unbekannte Adressen bekommen die index.html, der Router in
    # der Shell entscheidet dann — dort faengt die 404-Seite
    # (src/pages/NichtGefunden.jsx, Route path="*") alles ab, was keine Route
    # trifft. Der HTTP-Status bleibt dabei bewusst 200: nur der Client kennt
    # die Routen-Tabelle, und ein 404 vom Proxy wuerde jede gueltige Deep-Link-
    # Adresse mit erschlagen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
