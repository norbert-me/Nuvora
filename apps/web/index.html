    <!-- Schriften (Inter) und KaTeX werden lokal gebundelt — keine CDN-/Drittanbieter-Anfragen -->
    <style>
      :root {
        --bg: #ffffff; --bg2: #f5f5f7; --bg3: #fbfbfd;
        --text: #1d1d1f; --text2: #6e6e73; --text3: #737378;   /* 4,6:1 — #86868b lag bei 3,6:1 */
        --border: rgba(0,0,0,0.06); --border2: #d2d2d7; --border3: #e5e5e5;
        --card: #fff; --nav-bg: rgba(255,255,255,0.72); --nav-border: rgba(0,0,0,0.08);
        --accent: #0066cc; --accent-bg: #e8f0fe; --input-bg: #fff;
        --hover: rgba(0,0,0,0.05);
        /* Wo klebt ein Tabellenkopf? Standard: unter der Navigationsleiste
           (52 px, plus Offline-Balken). Eine Tabelle, die IN einem eigenen
           Rahmen scrollt, setzt die Variable bei sich auf 0 — dort ist der
           Rahmen der Bezug, nicht das Fenster. */
        --tabellenkopf-top: calc(52px + var(--safe-top, 0px) + var(--offline-banner-h, 0px));
        --success-bg: #d4edda; --warn-bg: #fff3cd; --danger-bg: #fde2d9;
        /* Wo endet der Bildschirm, und wo endet das BENUTZBARE Bild?
           Auf dem iPhone liegt oben die Statusleiste (in der installierten App
           ueber der Seite, weil `viewport-fit=cover` gesetzt ist) und unten der
           Strich zum Wischen. Ohne Aussparung steht die Navigationsleiste unter
           der Uhrzeit und die Speichern-Leiste unter dem Strich. Ein Wert, zwei
           Namen: gebraucht wird er in index.html und in Bauteilen, die inline
           gesetzt werden. Der Rueckfall 0px gilt ueberall sonst — auf dem
           Rechner gibt es keine unsicheren Raender. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      .dark {
        --bg: #000; --bg2: #1c1c1e; --bg3: #1c1c1e;
        --text: #f5f5f7; --text2: #ababaf; --text3: #98989d;
        --border: rgba(255,255,255,0.08); --border2: #48484a; --border3: #38383a;
        --card: #1c1c1e; --nav-bg: rgba(0,0,0,0.85); --nav-border: rgba(255,255,255,0.08);
        --accent: #0a84ff; --accent-bg: rgba(10,132,255,0.12); --input-bg: #2c2c2e;
        --hover: rgba(255,255,255,0.06);
        --success-bg: rgba(10,125,62,0.2); --warn-bg: rgba(184,134,11,0.15); --danger-bg: rgba(209,53,15,0.15);
        color-scheme: dark;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scrollbar-gutter: stable; }
      /* Inhalte wirkten einen Tick zu klein/rausgezoomt. Ein leichter,
         einheitlicher Zoom vergrößert ALLE Module gleich (auch die eingebetteten
         Lernpfad-/Code-Detektiv-Ansichten liegen in #root). */
      #root { zoom: 1.06; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        /* Quer gehalten liegt die Aussparung des iPhones links oder rechts.
           Nur waagerecht am body: senkrecht traegt sie die Navigationsleiste
           selbst (sie klebt oben und muesste sonst unter der Uhr stehen). */
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      input, select, button, textarea { font-family: inherit; }
      /* iOS zoomt beim Fokus in Felder mit Schrift < 16px hinein. Auf schmalen
         Bildschirmen darum überall mind. 16px erzwingen — verhindert das
         störende Rein-/Rauszoomen (z.B. beim Schreiben von Notizen). */
      @media (max-width: 640px) {
        input:not(.keep-fontsize), select, textarea:not(.keep-fontsize) { font-size: 16px !important; }
      }
      input, select, textarea { background: var(--input-bg); color: var(--text); border-color: var(--border2); }
      /* Der Anfasser zum Groesserziehen: das Betriebssystem zeichnet eine
         kleine graue Treppe aus Strichen, die in der runden Ecke halb
         verschwindet — man sieht dem Feld nicht an, dass man daran ziehen
         kann. Eine Zeit lang war er deshalb ganz unsichtbar (`transparent`),
         und damit war die Ansage endgueltig weg. Stattdessen jetzt ein
         eigener Keil in der Akzentfarbe: rund 5 px stark gegen den 1-px-Rand
         daneben, in der Ecke abgerundet wie das Feld selbst. */
      textarea::-webkit-resizer {
        background: linear-gradient(135deg, transparent 0 52%, var(--accent) 52% 100%);
        border-bottom-right-radius: 8px;
      }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
      }
      /* A11y: sichtbarer Fokus-Ring bei Tastatur-Navigation (Buttons/Links). */
      button:focus-visible, a:focus-visible, [role="switch"]:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
      }
      .dark input:focus, .dark select:focus, .dark textarea:focus { box-shadow: 0 0 0 3px rgba(10,132,255,0.25); }
      button { transition: all 0.15s ease; }
      button:hover { opacity: 0.85; }
      button:active { transform: scale(0.97); }
      button.icon-btn:hover { opacity: 1; background: var(--hover) !important; }
      button.icon-btn:active { background: var(--hover) !important; }
      ::selection { background: rgba(0, 102, 204, 0.2); }
      .dark ::selection { background: rgba(10,132,255,0.3); }
      table { font-variant-numeric: tabular-nums; }
      a { color: var(--accent); }
      @media (max-width: 600px) {
        nav { padding: 0 12px !important; gap: 2px !important; }
        nav > div:first-of-type { gap: 0 !important; }
      }
      /* Scrollbalken immer sichtbar (macOS blendet Overlay-Bars sonst aus):
         sobald ein Bereich scrollbar ist, zeigt der Balken, dass mehr Inhalt da
         ist. Eigene Webkit-Optik schaltet das Auto-Ausblenden ab. */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text3); border: 3px solid transparent; background-clip: padding-box; }
      * { scrollbar-width: auto; scrollbar-color: var(--border2) transparent; }
      /* Nav-Leiste bleibt ohne Balken. */
      nav > div { scrollbar-width: none; }
      nav > div::-webkit-scrollbar { display: none; }
      /* Ein Kasten in der Tagesspur ist so hoch wie seine Stunde — bei zehn
         Minuten sind das 22 px. Der normale 12-px-Balken waere darin die halbe
         Hoehe; hier reicht ein Strich, der beim Ueberfahren erscheint. */
      .tagblock::-webkit-scrollbar { width: 5px; }
      .tagblock::-webkit-scrollbar-thumb { background: transparent; border: none; border-radius: 3px; }
      .tagblock:hover::-webkit-scrollbar-thumb { background: var(--border2); }
      .tagblock { scrollbar-width: thin; scrollbar-color: transparent transparent; }
      .tagblock:hover { scrollbar-color: var(--border2) transparent; }
      @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
      @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    
      /* Der Rueckmeldebogen haengt NEBEN der Anwendung: React haengt ihn per
         Portal direkt an den <body>, nicht in #root. Am Bildschirm ist er aus. */
      .druck-huelle { display: none; }

      /* ─── Drucken ───
         Ein Ausdruck aus Nuvora ist ein Blatt fuer jemand anderen: die
         Rueckmeldung fuer ein Kind, die QR-Kaertchen zum Ausschneiden.
         Navigationsleiste, Werkzeugleisten und Fusszeile gehoeren nie darauf.

         Gibt es auf der Seite einen Druckbogen, wird die ganze Anwendung
         ausgeblendet und nur er gedruckt; sonst bleibt es beim normalen
         Ausdruck der Seite (die QR-Kaertchen etwa drucken sich als Seite).

         Vorher stand hier ein visibility-Trick plus `position: absolute`. Der
         ist genau daran gescheitert, wofuer es ihn gab: unsichtbare Elemente
         belegen ihren Platz weiter, der Bogen lag als absolut gesetzte Insel
         darueber, und der Drucker rechnete die Seiten nach dem unsichtbaren
         Rest aus. Ergebnis waren leere Blaetter und Kinder, die unten auf
         einem Blatt anfingen und oben auf dem naechsten weitergingen.
         `display: none` auf die Anwendung loest das an der Wurzel: was nicht
         im Fluss steht, verschiebt auch nichts. */
      @media print {
        body:has(.druck-huelle) > #root { display: none; }
        .druck-huelle { display: block; }

        /* Ein Blatt je Kind. break-BEFORE statt break-after: nur so faengt
           jedes Blatt wirklich oben an — ein `break-after` am vorherigen
           Element ignorieren Browser, sobald es das letzte in seinem
           Container ist. break-inside haelt zusammen, was zusammengehoert:
           lieber eine halb leere Seite als eine zerrissene Rueckmeldung. */
        .druck-seite { break-inside: avoid; page-break-inside: avoid; }
        .druck-seite + .druck-seite { break-before: page; page-break-before: always; }
      }
</style>
    <!-- Dunkles Design VOR dem ersten Zeichnen setzen, sonst blitzt die helle
         Flaeche kurz auf. try/catch, weil Safari im privaten Modus schon beim
         blossen Zugriff auf localStorage eine Ausnahme wirft — die letzte
         ungeschuetzte Speicherabfrage der Shell. -->
    <!-- Eigene Datei statt Inline-Script: nur so kommt die CSP ohne
         script-src 'unsafe-inline' aus (siehe public/theme.js). -->
    <script src="/theme.js"></script>
  </head>
