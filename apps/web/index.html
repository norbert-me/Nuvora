<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nuvora — Werkzeugkasten für Lehrkräfte</title>
    <!-- Ohne description zeigen Suchmaschinen und Link-Vorschauen zufaelligen
         Seitentext; die Landing-Seite ist oeffentlich. -->
    <meta name="description" content="Nuvora bündelt Unterrichtswerkzeuge für Lehrkräfte: Abstimmung ohne Geräte, Karteikarten, Notenbuch, Lernpfade, Kalender. Selbst gehostet, ohne Konten für Lernende.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Nuvora — Werkzeugkasten für Lehrkräfte">
    <meta property="og:description" content="Klassen, Kurse und Themen einmal anlegen, in allen Modulen nutzen. Selbst gehostet, keine Cloud, keine Konten für Lernende.">
    <meta property="og:image" content="/icon-512.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Zwei Werte: sonst traegt die Statusleiste im dunklen Design die helle Farbe. -->
    <meta name="theme-color" content="#0066cc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <!-- iPhone/iPad als „Zum Home-Bildschirm"-App (ohne App Store): Vollbild,
         Statusleiste passend, Home-Name kurz. Die App verhält sich dann wie
         ein eigenes Programm (kein Safari-Rahmen). -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nuvora">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Schriften (Inter) und KaTeX werden lokal gebundelt — keine CDN-/Drittanbieter-Anfragen -->
    <style>
      :root {
        --bg: #ffffff; --bg2: #f5f5f7; --bg3: #fbfbfd;
        --text: #1d1d1f; --text2: #6e6e73; --text3: #737378;   /* 4,6:1 — #86868b lag bei 3,6:1 */
        --border: rgba(0,0,0,0.06); --border2: #d2d2d7; --border3: #e5e5e5;
        --card: #fff; --nav-bg: rgba(255,255,255,0.72); --nav-border: rgba(0,0,0,0.08);
        --accent: #0066cc; --accent-bg: #e8f0fe; --input-bg: #fff;
        --hover: rgba(0,0,0,0.05);
        --success-bg: #d4edda; --warn-bg: #fff3cd; --danger-bg: #fde2d9;
        color-scheme: light;
      }
      .dark {
        --bg: #000; --bg2: #1c1c1e; --bg3: #1c1c1e;
        --text: #f5f5f7; --text2: #ababaf; --text3: #98989d;
        --border: rgba(255,255,255,0.08); --border2: #48484a; --border3: #38383a;
        --card: #1c1c1e; --nav-bg: rgba(0,0,0,0.85); --nav-border: rgba(255,255,255,0.08);
        --accent: #0a84ff; --accent-bg: rgba(10,132,255,0.12); --input-bg: #2c2c2e;
        --hover: rgba(255,255,255,0.06);
        --success-bg: rgba(10,125,62,0.2); --warn-bg: rgba(184,134,11,0.15); --danger-bg: rgba(209,53,15,0.15);
        color-scheme: dark;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scrollbar-gutter: stable; }
      /* Inhalte wirkten einen Tick zu klein/rausgezoomt. Ein leichter,
         einheitlicher Zoom vergrößert ALLE Module gleich (auch die eingebetteten
         Lernpfad-/Code-Detektiv-Ansichten liegen in #root). */
      #root { zoom: 1.06; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      input, select, button, textarea { font-family: inherit; }
      /* iOS zoomt beim Fokus in Felder mit Schrift < 16px hinein. Auf schmalen
         Bildschirmen darum überall mind. 16px erzwingen — verhindert das
         störende Rein-/Rauszoomen (z.B. beim Schreiben von Notizen). */
      @media (max-width: 640px) {
        input:not(.keep-fontsize), select, textarea:not(.keep-fontsize) { font-size: 16px !important; }
      }
      input, select, textarea { background: var(--input-bg); color: var(--text); border-color: var(--border2); }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
      }
      /* A11y: sichtbarer Fokus-Ring bei Tastatur-Navigation (Buttons/Links). */
      button:focus-visible, a:focus-visible, [role="switch"]:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
      }
      .dark input:focus, .dark select:focus, .dark textarea:focus { box-shadow: 0 0 0 3px rgba(10,132,255,0.25); }
      button { transition: all 0.15s ease; }
      button:hover { opacity: 0.85; }
      button:active { transform: scale(0.97); }
      button.icon-btn:hover { opacity: 1; background: var(--hover) !important; }
      button.icon-btn:active { background: var(--hover) !important; }
      ::selection { background: rgba(0, 102, 204, 0.2); }
      .dark ::selection { background: rgba(10,132,255,0.3); }
      table { font-variant-numeric: tabular-nums; }
      a { color: var(--accent); }
      @media (max-width: 600px) {
        nav { padding: 0 12px !important; gap: 2px !important; }
        nav > div:first-of-type { gap: 0 !important; }
      }
      /* Scrollbalken immer sichtbar (macOS blendet Overlay-Bars sonst aus):
         sobald ein Bereich scrollbar ist, zeigt der Balken, dass mehr Inhalt da
         ist. Eigene Webkit-Optik schaltet das Auto-Ausblenden ab. */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text3); border: 3px solid transparent; background-clip: padding-box; }
      * { scrollbar-width: auto; scrollbar-color: var(--border2) transparent; }
      /* Nav-Leiste bleibt ohne Balken. */
      nav > div { scrollbar-width: none; }
      nav > div::-webkit-scrollbar { display: none; }
      @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
      @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    </style>
    <script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark');</script>
  </head>
  <body>
    <noscript>
      <div style="max-width: 460px; margin: 80px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1 style="font-size: 20px;">Nuvora braucht JavaScript</h1>
        <p>Die Oberfläche wird im Browser aufgebaut. Bitte JavaScript aktivieren
           und die Seite neu laden.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
