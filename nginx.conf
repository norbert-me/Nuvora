# Nuvora-Proxy: eine Domain, alle Module.
#
# ─── DDoS-/Missbrauchs-Schutz an der Kante ───
# Zonen liegen im http-Kontext (diese Datei wird als conf.d/*.conf INNERHALB
# von http eingebunden). Zweite Verteidigungslinie zusaetzlich zum App-seitigen
# Flood-Schutz (AbuseGuardMiddleware): faengt Last ab, bevor sie die API/den
# Node-Prozess erreicht. Grosszuegig gewaehlt, damit Live-Sessions (viele Scans
# kurz nacheinander) nicht ausgebremst werden.
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=30r/s;   # ~30 Anfragen/s je IP
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;            # gleichzeitige Verbindungen je IP

# ─── Schueler-Wege: eine Schulklasse ist EINE Adresse ───
# Lernende haben keine Konten; sie kommen ueber einen Token (/api/karten/lernen/)
# oder einen Sitzungscode (/api/codedetektiv/sessions/). 30 Geraete haengen hinter
# EINEM Schul-NAT — fuer $binary_remote_addr sind sie ein einziger Client.
# Gerechnet: die Code-Detektiv-App fragt alle 1,8 s den Stand ab (store.jsx), das
# sind 30/1,8 s ≈ 17 r/s je Klasse. Eine Klasse passte gerade so unter die 30 r/s
# der allgemeinen Zone, zwei parallele Klassen (34 r/s) nicht mehr — nach dem
# Puffer von 80 haette es Dauer-429 gegeben, mitten in der Stunde.
# Darum eine eigene, weite Zone NUR fuer diese beiden Praefixe. Der Missbrauchs-
# schutz geht dabei nicht verloren, er sitzt nur an der richtigen Stelle: die App
# drosselt hier je TOKEN bzw. je SITZUNGSCODE (karten.py, codedetektiv.py) und
# zaehlt Fehlgriffe auf geratene Codes weiterhin eng je Adresse.
limit_req_zone  $binary_remote_addr zone=schueler_rl:10m rate=150r/s;
limit_req_status  429;
limit_conn_status 429;

# ─── Kompression an der Kante ───
# Die Statik komprimiert der web-Container selbst (apps/web/nginx.conf), aber
# /api/ geht von hier direkt an die API — und deren Antworten gingen
# unkomprimiert raus. Es sind reine JSON-Listen (Klassen mit allen Schuelern,
# Noten, Kalender, Kartenstapel): der Datentyp, bei dem gzip am meisten holt,
# grob 80 %. Genau die Seiten, die im Schul-WLAN am zaehesten laden.
# gzip_proxied any: ohne das komprimiert nginx eine Antwort vom Upstream nicht.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types application/json text/plain text/css application/javascript text/javascript
           image/svg+xml application/xml font/woff2;

# ─── Dauerverbindungen zu den Diensten ───
# Ohne upstream-Block mit keepalive baut nginx fuer JEDE Anfrage eine neue
# TCP-Verbindung zum Dienst auf und wieder ab. Bei den Poll-Wegen (eine Klasse
# = ~17 Anfragen je Sekunde) ist das mehr Arbeit fuer Handschlag und Abbau als
# fuer die Antwort selbst. Die Namen loest nginx beim Start auf — genau wie
# vorher bei "proxy_pass http://api:8000", also kein neues Startrisiko.
upstream nuvora_api {
    server api:8000;
    keepalive 32;
}

upstream nuvora_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Gleichzeitige Verbindungen je IP deckeln (Slowloris/Verbindungs-Fluten).
    # 200 statt 50: eine Klasse (30 Geraete, die gleichzeitig pollen) belegt
    # 30 gleichzeitig bearbeitete Verbindungen, zwei bis drei Klassen aus
    # demselben Schul-NAT sprengten die alten 50.
    limit_conn perip_conn 200;

    # ─── Sicherheits-Header, an EINER Stelle fuer alle Antworten ───
    # Frueher setzte nur das CardVote-Frontend Header; /api und die
    # eingebettete Lernpfad-App bekamen keine. Hier greifen sie fuer alles,
    # was ueber den Proxy geht.
    #
    # SAMEORIGIN, nicht DENY: die Lernpfad-App laeuft als iframe auf derselben
    # Origin — DENY wuerde auch das blocken. Fremdes Einbetten bleibt gesperrt.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    # 'unsafe-inline' ist noetig: CardVote und die Lernpfad-App nutzen beide
    # Inline-Styles; connect-src erlaubt WebSockets fuer die Live-Session.
    # frame-src blob:: die Materialvorschau (Klassenarbeit, Themen, Stunden)
    # zeigt PDFs in einem iframe. Die Datei kommt per fetch mit Token und liegt
    # danach als blob: vor — ohne diese Erlaubnis bliebe der Rahmen leer. Fremde
    # Herkunft bleibt gesperrt: blob: ist immer die eigene, schon geladene Datei.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; font-src 'self' data:; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # nginx-Version nicht preisgeben.
    server_tokens off;

    # ─── Lernpfad-App: liefert nur noch Statik (index.html, css, js, vendor),
    #     die die Shell in-page injiziert; kein iframe mehr. ───
    # Lernpfad ist ins Web-Projekt eingebaut: die Statik liegt unter
    # apps/web/public/lp/ und kommt vom web-Container (Route /lernpfad mountet
    # sie in-page). Kein eigener lernpfad-Container / kein /lernpfad-app/ mehr.

    # ─── Betreiberdaten: eine Quelle fuer beide Module ───
    # CardVotes Impressum (Legal.jsx) fetcht /site.json; Lernpfad liest
    # dieselbe Datei serverseitig ueber seinen config/-Mount.
    location = /site.json {
        alias /srv/config/site.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        # ACHTUNG: nginx vererbt add_header NICHT in einen Block, der selbst
        # welche setzt — mit der Cache-Control-Zeile oben verlor genau diese
        # Route alle Schutz-Kopfzeilen. Deshalb hier wiederholen. Gilt fuer
        # jeden neuen location-Block mit eigenem add_header.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # ─── Schueler-Wege (ohne Login, per Token/Sitzungscode) ───
    # Laengster Praefix gewinnt: diese beiden Bloecke greifen VOR /api/ und
    # nehmen die weite schueler_rl-Zone (Begruendung ganz oben).
    # OHNE abschliessenden Schraegstrich. Mit ihm schickt nginx fuer die Adresse
    # ohne Schraegstrich eine 301-Umleitung — und baut sie aus server_name plus
    # dem INNEREN Port zusammen, verliert also den veroeffentlichten Port:
    # POST /api/codedetektiv/sessions -> 301 -> http://192.168.10.75/... (Port 80).
    # Dort antwortet der Reverse-Proxy des NAS mit 404, und das Anlegen einer
    # Code-Detektiv-Sitzung war tot. Ein Praefix ohne Schraegstrich passt auf
    # beide Formen und leitet nichts um.
    location /api/karten/lernen {
        limit_req zone=schueler_rl burst=300 nodelay;
        proxy_pass http://nuvora_api;
        # HTTP/1.1 + leerer Connection-Header: Voraussetzung dafuer, dass die
        # Dauerverbindungen aus dem upstream-Block oben ueberhaupt benutzt werden.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/codedetektiv/sessions {
        limit_req zone=schueler_rl burst=300 nodelay;
        proxy_pass http://nuvora_api;
        # HTTP/1.1 + leerer Connection-Header: Voraussetzung dafuer, dass die
        # Dauerverbindungen aus dem upstream-Block oben ueberhaupt benutzt werden.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── CalDAV-Erkennung (Apple, Outlook, Thunderbird) ───
    #
    # Ein CalDAV-Client fragt zuerst /.well-known/caldav und folgt der
    # Weiterleitung. Ohne diesen Block muesste die Lehrkraft die volle Adresse
    # von Hand eintippen — und die Kontoeinrichtung sagt bei einem Tippfehler
    # nur „Server nicht gefunden", ohne zu verraten, wo es hakte.
    #
    # 301 und nicht 302: die Clients merken sich das Ziel dauerhaft, und die
    # Adresse aendert sich nicht.
    location = /.well-known/caldav {
        return 301 /api/caldav/;
    }

    # ─── CardVote auf / (Kern) ───
    location /api/ {
        # Edge-Rate-Limit: 20 r/s je IP, kurze Spitzen bis 40 gepuffert (nodelay
        # = Puffer sofort durchlassen, nur echtes Dauerfeuer bekommt 429).
        limit_req zone=api_rl burst=80 nodelay;
        proxy_pass http://nuvora_api;
        # HTTP/1.1 + leerer Connection-Header: Voraussetzung dafuer, dass die
        # Dauerverbindungen aus dem upstream-Block oben ueberhaupt benutzt werden.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://nuvora_web;
        # HTTP/1.1 zum web-Container, nicht das Standard-1.0 von proxy_pass:
        # nginx komprimiert per Voreinstellung (gzip_http_version 1.1) NICHT,
        # wenn die Anfrage als HTTP/1.0 hereinkommt. Der web-Container hat also
        # gzip eingeschaltet und trotzdem alles unkomprimiert ausgeliefert —
        # das komplette Frontend-Bundle bei jedem ersten Aufruf.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
