# Nuvora — Kern und alle Module hinter EINEM Proxy auf EINER Domain.
#
#   /         Shell mit allen Modulseiten (web)
#   /api/     Kern-API (api)
#   /lp/      Statik der eingebetteten Lernpfad-App, ausgeliefert vom web-Container
#
# Vier Dienste: db, api, web, proxy. Es gibt KEINE Einzel-Composes in apps/* —
# alles wird hier konfiguriert (siehe CLAUDE.md, "Alles wird im Wurzelverzeichnis
# konfiguriert").

# Logs bleiben sonst unbegrenzt liegen und fuellen irgendwann die Platte des
# Schulservers. Gilt fuer alle Dienste ueber den YAML-Anker.
x-logging: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Images sind auf ihren Digest festgenagelt: bewegliche Tags wie "postgres:16"
# zeigen jede Woche woanders hin, damit ergeben zwei Builds vom selben Commit
# unterschiedliche Container. Der Tag bleibt trotzdem stehen, damit lesbar ist,
# was gemeint ist — gebunden wird der Digest dahinter.
#
# Digest neu holen (Beispiel postgres:16; fuer nginx:alpine beide Stellen —
# hier und apps/web/Dockerfile — gleich setzen):
#   N=postgres T=16; TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/$N:pull" | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])"); curl -sI -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" "https://registry-1.docker.io/v2/library/$N/manifests/$T" | grep -i docker-content-digest
#
# Wichtig: den Index-Digest nehmen (Accept-Header oben), nicht den einer
# einzelnen Architektur — der Server laeuft amd64, entwickelt wird auf arm64.

services:
  db:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuvora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nicht gesetzt — .env aus .env.example anlegen}
      POSTGRES_DB: ${POSTGRES_DB:-nuvora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Ohne diesen Check startet api los, bevor Postgres Verbindungen annimmt,
    # stirbt an "Connection refused" und wird nur vom restart wieder eingefangen.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuvora} -d ${POSTGRES_DB:-nuvora}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./apps/api
    restart: unless-stopped
    logging: *logs
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nuvora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nuvora}
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET nicht gesetzt — .env aus .env.example anlegen}
      CORS_ORIGINS: ${SITE_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_URL: ${SITE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Nuvora}
      # Damit der Selbsttest nach dem Deploy auch mit seinem eigenen Konto an
      # die Einrichtungs-Pruefungen kommt (Schema, Konfiguration, E-Mail) —
      # ohne dafuer das Administrationskonto benutzen zu muessen.
      SELFTEST_TOKEN: ${SELFTEST_TOKEN:-}
    volumes:
      - uploads:/app/uploads
      # Sicherungen (Administration -> Sicherung). Eigenes Volume, NICHT unter
      # uploads: /api/uploads ist ein StaticFiles-Mount und ohne Anmeldung
      # lesbar — eine Sicherung enthaelt Art.-9-Daten aller Schueler. Ohne
      # dieses Volume waeren alle Sicherungen beim naechsten Bauen weg.
      - backups:/app/backups
      # Betreiberdaten: der Setup-Check im Admin-Profil prueft
      # /app/config/site.json. Ohne diesen Mount galt das Impressum immer als
      # fehlend, obwohl nginx dieselbe Datei unter /site.json ausliefert.
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          # apps/web/nginx.conf proxyt intern auf Host "backend".
          # Alias, damit die App-eigene Config unveraendert weiterlaeuft.
          - backend

  web:
    build: ./apps/web
    restart: unless-stopped
    logging: *logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # Lernpfad ist ins Web-Projekt eingebaut (apps/web/public/lp/) — kein eigener
  # Container mehr. Frueher: eigener Statik-Container hinter /lernpfad-app/.

  proxy:
    # Digest festgenagelt, siehe Kopf der Datei. Gleiche Fassung wie in
    # apps/web/Dockerfile — beide zusammen aktualisieren.
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    restart: unless-stopped
    logging: *logs
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Liefert /site.json aus — CardVotes Impressum liest dieselbe Datei,
      # die Lernpfad serverseitig einliest.
      - ./config:/srv/config:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
