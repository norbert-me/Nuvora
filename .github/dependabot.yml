# Abhängigkeiten aktuell halten, ohne dass jemand daran denken muss.
# Wöchentlich, gebündelt — bei einem Ein-Personen-Projekt zählt, dass die
# Meldungen nicht im Rauschen untergehen.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      alle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      alle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
