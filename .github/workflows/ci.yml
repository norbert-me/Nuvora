name: CI

# Läuft bei jedem Push und PR: API-Tests + Web-Build. Fängt Regressionen ab,
# bevor ein Tag ein Release schneidet (release.yml macht nur das Release).
on:
  push:
    branches: ["**"]
  pull_request:

# Lesen reicht: die CI baut und testet nur, sie schreibt nichts ins Repo.
permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Aus der Lock-Datei, damit die Tests gegen genau die Fassungen laufen, die
      # auch im Container landen. Die Testwerkzeuge (requirements-dev.txt) duerfen
      # frei bleiben: sie werden nie ausgeliefert.
      - name: Abhängigkeiten
        run: |
          pip install --require-hashes -r requirements.lock.txt
          pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q

      # Bekannte Luecken in den Python-Abhaengigkeiten. Meldet, blockiert aber
      # nicht: ein unbehebbares Upstream-CVE soll die CI nicht dauerhaft roetten.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --no-deps -r requirements.lock.txt

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Installieren
        run: npm ci
      # Die Logik unter src/core (E/G-Wertung, Notenskala, Modul-Schluessel).
      # Einmalig, nicht im Watch-Modus — "vitest run" beendet sich selbst.
      - name: Frontend-Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Der Weg, den ein Fremder nimmt: docker compose build. Lief bisher nur beim
  # Deploy — ein Fehler im Dockerfile fiel damit erst auf dem Zielserver auf.
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Datei prüfen und bauen
        env:
          POSTGRES_PASSWORD: ci-test-nur-fuer-den-build
          TOKEN_SECRET: ci-test-nur-fuer-den-build
        run: |
          docker compose config >/dev/null
          docker compose build api web
