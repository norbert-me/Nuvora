name: Release

# Jeder Tag-Push v* erzeugt ein Release.
# Regel: ändert sich die führende Zahl (Major) gegenüber dem letzten Tag,
# geht es in den main/latest-Kanal. Sonst prerelease = beta-Kanal.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Kanal bestimmen (Major geändert?)
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME}"                 # z.B. v1.5.31
          CUR_MAJOR="$(echo "${TAG#v}" | cut -d. -f1)"
          # Das zeitlich VORHERIGE Tag, nicht das hoechste: ein nachgereichter
          # Hotfix auf einem aelteren Stand (v3.12.1 neben v4.1.0) haette sonst
          # gegen v4 verglichen, einen Major-Wechsel gesehen und sich selbst als
          # stable veroeffentlicht.
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"
          PREV_MAJOR="$(echo "${PREV#v}" | cut -d. -f1)"
          if [ -n "$PREV_MAJOR" ] && [ "$CUR_MAJOR" != "$PREV_MAJOR" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Major $PREV_MAJOR -> $CUR_MAJOR : main/latest"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Major unverändert ($CUR_MAJOR): beta (prerelease)"
          fi

      # Stueckliste der Abhaengigkeiten (CycloneDX). Wer Nuvora an einer Schule
      # betreibt, kann damit belegen, was im Container steckt — und bei einer
      # gemeldeten Luecke nachsehen, ob sie ihn betrifft.
      - name: SBOM erzeugen
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: nuvora-sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: nuvora-sbom.cyclonedx.json
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
